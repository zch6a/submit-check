# Every value below is taken from the official call for papers; `source` says where, `verified` when it was read.
# Corrections welcome: change the value, the source and the date in one pull request.
[venue]
id = "neurips2025"
name = "NeurIPS 2025"
source = "https://neurips.cc/Conferences/2025/CallForPapers"
verified = "2026-11-13"
template = "neurips"

[pages]
# "The main text of a submitted paper is limited to nine content pages, including all figures and tables."
submission = 9
# "If your submission is accepted, you will be allowed an additional content page for the camera-ready version."
camera_ready = 10
# "Additional pages containing references, checklist, and the optional technical appendices do not count as content pages."
not_counted = ["references", "checklist", "appendix"]

[anonymity]
# "All submissions must be anonymized."
required = true

[[required]]
# "authors are required to complete a paper checklist"
what = "the NeurIPS paper checklist"
pattern = 'checklist'
modes = ["submission", "camera-ready"]
severity = "error"

[policy]
# From the same official page as the rules above, quotes checked against its text on 2026-11-14; "" when it does not say.
# Authors are responsible for following it.
llm = "follow the NeurIPS LLM policy (https://neurips.cc/Conferences/2025/LLM)"
llm_disclose = ""
# Authors may submit up to 100MB of technical appendices and supplementary material.
supplementary = "May 22, 2025 AoE (a week after the paper), up to 100 MB, one ZIP"
# Authors will have one week to view and respond to initial reviews.
rebuttal = "one week to respond to the initial reviews"
